name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "=== 1. Buscar directorio del proyecto ==="
            ARTISAN_PATH=$(find /home /var /srv /www /opt -name "artisan" 2>/dev/null | head -n 1)
            if [ -n "$ARTISAN_PATH" ]; then
              PROJECT_DIR=$(dirname "$ARTISAN_PATH")
            else
              PROJECT_DIR="/home/deploy"
            fi
            echo "PROJECT_DIR=$PROJECT_DIR"

            # Ejecutar deploy script original si existe
            if [ -f /home/deploy/deploy-layrafit.sh ]; then
              echo "=== Ejecutando deploy-layrafit.sh ==="
              bash /home/deploy/deploy-layrafit.sh || true
            fi

            # Forzar git sync y limpieza en PROJECT_DIR
            if [ -d "$PROJECT_DIR/.git" ]; then
              cd "$PROJECT_DIR"
              echo "En repositorio: $(pwd)"
              git fetch origin main
              git checkout -f main
              git reset --hard origin/main
              
              # Limpieza total de caches de Laravel
              php artisan view:clear || true
              php artisan optimize:clear || true
              php artisan cache:clear || true
              php artisan config:clear || true
              php artisan route:clear || true

              # Limpiar OPcache y vistas de PHP-FPM via HTTP
              curl -k -s "http://127.0.0.1/flush_cache.php?key=layra_deploy_2026" || true
              curl -k -s "https://fitbeat.aulanova.org/flush_cache.php?key=layra_deploy_2026" || true

              # Escribir informe detallado en public/debug.txt
              {
                echo "=== DEPLOY REPORT ==="
                echo "DATE: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                echo "PROJECT_DIR: $PROJECT_DIR"
                echo "GIT_COMMIT: $(git rev-parse HEAD)"
                echo "GIT_LOG: $(git log -1 --oneline)"
                echo "=== SCRIPT /home/deploy/deploy-layrafit.sh ==="
                if [ -f /home/deploy/deploy-layrafit.sh ]; then
                  cat /home/deploy/deploy-layrafit.sh
                else
                  echo "No existe /home/deploy/deploy-layrafit.sh"
                fi
                echo "=== VIEW FILE CHECK ==="
                head -n 25 resources/views/auth/login.blade.php
              } > public/debug.txt
              chmod 644 public/debug.txt || true

              # Recargar php-fpm si esta disponible
              sudo systemctl reload php8.3-fpm 2>/dev/null || sudo systemctl reload php-fpm 2>/dev/null || sudo service php8.3-fpm reload 2>/dev/null || true
            fi
            echo "=== FIN ==="
