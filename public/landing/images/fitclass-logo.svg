<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="fitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Symbol: Stylized 'F' with Athletic Dynamic Waves -->
  <g transform="translate(20, 15)">
    <!-- Outer hexagonal badge -->
    <rect x="0" y="0" width="90" height="90" rx="24" fill="#0F172A" stroke="url(#fitGrad)" stroke-width="3" />
    
    <!-- Dynamic Lightning / Flame Motion -->
    <path d="M 28 68 L 48 22 L 68 22 L 52 46 L 70 46 L 36 78 L 44 54 Z" fill="url(#flameGrad)" filter="url(#glow)" />
    <!-- Pulse dot -->
    <circle cx="68" cy="22" r="4" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <g transform="translate(130, 72)">
    <!-- FIT -->
    <text font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="48" letter-spacing="-1" fill="#FFFFFF">
      FIT<tspan fill="url(#fitGrad)">CLASS</tspan>
    </text>
  </g>

  <!-- Tagline / Badge -->
  <g transform="translate(132, 96)">
    <rect x="0" y="-12" width="160" height="18" rx="9" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1" />
    <text x="8" y="1" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" fill="#38BDF8">
      SAAS FITNESS CLOUD
    </text>
  </g>
</svg>
